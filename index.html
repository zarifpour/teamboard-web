<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Teamboard</title>
    <style>
      :root { font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #172033; background: #f4f6fa; }
      * { box-sizing: border-box; }
      body { margin: 0; }
      header { display: flex; align-items: center; justify-content: space-between; padding: 24px 32px; background: #fff; border-bottom: 1px solid #dde2eb; }
      h1 { margin: 0; font-size: 22px; }
      .team { color: #667085; font-size: 14px; }
      main { padding: 32px; }
      .title-row { display: flex; align-items: end; justify-content: space-between; margin-bottom: 24px; }
      h2 { margin: 0 0 6px; font-size: 28px; }
      p { margin: 0; color: #667085; }
      button { border: 0; border-radius: 8px; padding: 10px 14px; color: #fff; background: #4f46e5; font-weight: 650; }
      .board { display: grid; grid-template-columns: repeat(3, minmax(220px, 1fr)); gap: 18px; }
      .column { min-height: 420px; padding: 16px; border: 1px solid #e1e5ed; border-radius: 12px; background: #eef1f6; }
      .column h3 { margin: 0 0 14px; font-size: 14px; text-transform: uppercase; letter-spacing: .05em; color: #667085; }
      .card { margin-bottom: 12px; padding: 16px; border-radius: 10px; background: #fff; box-shadow: 0 1px 2px rgb(16 24 40 / 8%); }
      .card strong { display: block; margin-bottom: 14px; font-size: 15px; }
      .meta { display: flex; justify-content: space-between; color: #7b8496; font-size: 12px; }
      .priority { color: #b42318; }
      @media (max-width: 760px) { .board { grid-template-columns: 1fr; } header, main { padding: 20px; } }
    </style>
  </head>
  <body>
    <header><h1>Teamboard</h1><span class="team">Product Engineering</span></header>
    <main>
      <div class="title-row">
        <div><h2>Roadmap</h2><p>Plan and track the work moving through the team.</p></div>
        <button type="button">New task</button>
      </div>
      <section class="board" aria-label="Product roadmap">
        <div class="column"><h3>Backlog · 2</h3>
          <article class="card"><strong>Saved board views</strong><div class="meta"><span>Web App</span><span>Jamie</span></div></article>
          <article class="card"><strong>Export audit history</strong><div class="meta"><span>API</span><span>Priya</span></div></article>
        </div>
        <div class="column"><h3>In progress · 2</h3>
          <article class="card"><strong>Assignee quick filter</strong><div class="meta"><span>Web App</span><span class="priority">High</span></div></article>
          <article class="card"><strong>Task export endpoint</strong><div class="meta"><span>API</span><span>Marco</span></div></article>
        </div>
        <div class="column"><h3>Done · 1</h3>
          <article class="card"><strong>Activity feed query</strong><div class="meta"><span>API</span><span>Released</span></div></article>
        </div>
      </section>
    </main>
  </body>
</html>
